name: tests

on: [push, pull_request]

jobs:
  test-local:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: [ "RPi-OpenWRT", "RPi-RaspberryPiOSLite", "Shrink", "Remote-Include-Example" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y binfmt-support exfatprogs fdisk file git kpartx lsof p7zip-full qemu-user-static unzip wget xz-utils units
        shell: bash

      - name: Run pimod ${{ matrix.image }} example
        run: sudo ./pimod.sh examples/${{ matrix.image }}.Pifile

      - name: Output image is readable by the runner
        run: |
          pifile="examples/${{ matrix.image }}.Pifile"
          img="${pifile%.Pifile}.img"
          to=$(grep -E '^TO[[:space:]]+' "$pifile" | tail -n1 | awk '{print $2}')
          if [[ -n "$to" ]]; then
            img="$to"
          fi
          mode=$(stat -c %a "$img")
          echo "${img} mode=${mode}"
          test -r "$img"

  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run pimod OpenWRT example
        uses: Nature40/pimod@HEAD
        with:
          pifile: examples/RPi-OpenWRT.Pifile
