name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Settings are in .shellcheckrc. The modules and stages are sourced via
      # runtime paths, so each script is checked on its own.
      - name: Shellcheck all scripts
        run: |
          shellcheck --version
          shellcheck pimod.sh pidiff.sh modules/*.sh stages/*.sh tests/*.sh
