name: 'Run PIDIFF'
description: 'Compare two disk images and generate an rsync batch file for incremental updates'
branding:
  icon: 'git-compare'
  color: 'blue'

inputs:
  base_image:
    description: 'Path to base image file'
    required: true
  updated_image:
    description: 'Path to updated image file'
    required: true
  partition:
    description: 'Rootfs partition number'
    required: false
    default: '2'
  output:
    description: 'Output batch file path'
    required: false
  tar:
    description: 'Create tar archive containing batch and batch.sh files'
    required: false
    default: 'false'
  rsync_options:
    description: 'Additional rsync options to pass through (space-separated, e.g., "--verbose --exclude=*.pyc")'
    required: false

runs:
  using: "composite"
  steps:
    - run: sudo apt-get update
      shell: bash
    - run: sudo apt-get install -y kpartx rsync
      shell: bash
    - name: Run pidiff
      # Inputs are passed via the environment, never interpolated into the
      # script, so they cannot inject shell code.
      run: |
        PIDIFF_ARGS=()
        if [[ -n "${PIDIFF_PARTITION}" ]]; then
          PIDIFF_ARGS+=("--partition=${PIDIFF_PARTITION}")
        fi
        if [[ -n "${PIDIFF_OUTPUT}" ]]; then
          PIDIFF_ARGS+=("--output=${PIDIFF_OUTPUT}")
        fi
        if [[ "${PIDIFF_TAR}" == "true" ]]; then
          PIDIFF_ARGS+=("--tar")
        fi
        if [[ -n "${PIDIFF_RSYNC_OPTIONS}" ]]; then
          # Split rsync_options by spaces and add each option to PIDIFF_ARGS
          # This handles options like --verbose --exclude=*.pyc --exclude-from=file
          read -ra RSYNC_OPTS <<< "${PIDIFF_RSYNC_OPTIONS}"
          PIDIFF_ARGS+=("${RSYNC_OPTS[@]}")
        fi
        sudo "${GITHUB_ACTION_PATH}/../pidiff.sh" "${PIDIFF_ARGS[@]}" "${PIDIFF_BASE_IMAGE}" "${PIDIFF_UPDATED_IMAGE}"
      shell: bash
      env:
        PIDIFF_PARTITION: ${{ inputs.partition }}
        PIDIFF_OUTPUT: ${{ inputs.output }}
        PIDIFF_TAR: ${{ inputs.tar }}
        PIDIFF_RSYNC_OPTIONS: ${{ inputs.rsync_options }}
        PIDIFF_BASE_IMAGE: ${{ inputs.base_image }}
        PIDIFF_UPDATED_IMAGE: ${{ inputs.updated_image }}
